<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobreposição de elementos</title>
    <style>
        .caixa1 {
            border: 1px solid blue;
            background-color: lightblue;
            width: 100px;
            height: 100px;
            /* position: absolute; */
            top: 100px;
            left: 100px;
            z-index: 1;
        }
        .caixa2 {
            border: 1px solid red;
            background-color: lightcoral;
            width: 100px;
            height: 100px;
            /* position: absolute; */
            top: 80px;
            left: 80px;
            z-index: 0;
        }

        .caixa3 {
            border: 1px solid green;
            background-color: lightgreen;
            width: 100px;
            height: 100px;
            /* position: absolute; */
            top: 160px;
            left: 160px;
            z-index: 3;
        }

        #exercicio-sobreposicao {
            /* border: 1px solid red; */
            /* padding: 1em; */
        }

        .caixa {
            background-color: purple;
            position: relative;
            width: 700px;
        }

        .caixa img {
            width: 700px;
        }

        .destaque {
            background-color: orange;
            color: white;
            padding: 10px 16px;
            border-radius: 30px;
            position: absolute;
            bottom: 2.5em;
            left: 2em;
        }

        .promocao {
            background-color: white;
            border: 2px dotted purple;
            color: purple;
            position: absolute;
            bottom: -1.8em;
            padding: 1em;
            left: 10%;
            right: 10%;
            text-align: center;
            border-radius: 0 0 20px 20px;
        }

    </style>
</head>
<body>
    
    <div class="caixa1">
        Caixa 1
    </div>

    <div class="caixa2">
        Caixa 2
    </div>

    <div class="caixa3">
        Caixa 3
    </div>

    <hr>

    <div id="exercicio-sobreposicao">
        <h1>Exercício</h1>
        <div class="caixa">
            <img src="./img/banner.png" alt="">

            <div class="destaque">
                Tempo limitado
            </div>

            <div class="promocao">
                Quero a promoção
            </div>
        </div>
    </div>

</body>
</html>
