<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio pseudo-classe-elemento</title>

    <style>
        a {
            text-decoration: none;
            padding: 0.5em 1em;
            color: blueviolet;
        }

        a:hover {
            background-color: blueviolet;
            color: white;
            
        }

        a:active {
            color: lightblue;
        }

    </style>
    
</head>
<body>
    <a href="">Home</a> | 
    <a href="">Sobre</a> | 
    <a href="">Empresa</a> |
    <a href="">Produtos</a> |
    <a href="">Contato</a>
</body>
</html>
