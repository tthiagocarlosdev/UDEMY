<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Fotos</title>
</head>
<body>
    <h1>Caminhos relativos e absolutos</h1>
    <img src="./praia.jpeg" 
        alt="Imagem de uma praia"
        title="Praia da Boa Vista"

            alt="Imagem de uma praia"
            title="Praia da Boa Vista"
            width="300"

    </figure>
