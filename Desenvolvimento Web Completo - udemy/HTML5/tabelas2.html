<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table, td, th{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>Tabelas</h1>
    <table>
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Notebook</td>
            <td>1</td>
            <td>R$2.000,00</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>2</td>
            <td>R$1.000,00</td>
        </tr>
        <tr>
            <td rowspan="2" >Desconto</td>
            <td colspan="2" > Cupom 1 - R$20,00</td>
        </tr>
        <tr>
            <td colspan="2" > Cupom 2 - R$25,00</td>
        </tr>

    </table>
</body>
</html>
