<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>em & rem</title>
    <style>
        html {
            font-size: 16px;
        }
        body {
            font-size: 16px;
        }
        p {
            font-size: 2em;
        }
        .caixa-pequena {
            border: 3px solid black;
            font-size: 16px;
        }
        .caixa-grande {
            border: 3px solid red;
            font-size: 32px;
        }

        .um-em {
            font-size: 1em;
        }
        .dois-em {
            font-size: 2em;
        }
        .tres-em {
            font-size: 3em;
        }

        .em {
            font-size: 1em;
            border: 3px solid red;
        }
        .rem {
            font-size: 1rem;
            border: 3px solid purple;
        }
        .porcentagem {
            font-size: 100%;
            border: 3px solid green;
        }
        #area {
            border: 3px solid black;
            width: 500px;
            font-size: 32px;
        }
    </style>
</head>
<body>
    <h1>em & rem</h1>

    <div class="caixa-pequena">
        <p>Thiago Carlos</p>
            Thiago Carlos
    </div>

    <hr>

    <div class="caixa-grande">
        <p>Thiago Carlos</p>
            Thiago Carlos
    </div>

    <p class="tres-em">Destaque</p>
    <p class="um-em">Menor</p>
    <p class="dois-em">Médio</p>

    <hr>

    <div id="area">
        <p class="em">EM</p>
        <p class="rem">REM</p>
        <p class="porcentagem">PORCENTAGEM</p>
    </div>

</body>
</html>
